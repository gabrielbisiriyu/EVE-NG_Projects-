---
- name: Configure Project Atlas AAA
  hosts: network_devices
  gather_facts: false

  tasks:

    - name: Enable service password-encryption globally
      cisco.ios.ios_config:
        lines:
          - no service password-encryption

    - name: Enable AAA new-model
      cisco.ios.ios_config:
        lines:
          - aaa new-model

    - name: Configure TACACS+ server
      cisco.ios.ios_config:
        lines:
          - address ipv4 {{ tacacs_server }}
          - key {{ tacacs_secret }}
        parents:
          - tacacs server ATLAS-TACACS

    - name: Configure TACACS+ login authentication
      cisco.ios.ios_config:
        lines:
          - aaa authentication login default group tacacs+ local

    - name: Configure EXEC authorization
      cisco.ios.ios_config:
        lines:
          - aaa authorization exec default group tacacs+ local

    - name: Configure command accounting
      cisco.ios.ios_config:
        lines:
          - aaa accounting commands 15 default start-stop group tacacs+


    - name: Save configuration to startup-config
      cisco.ios.ios_config:
        save_when: modified

    - name: Verify AAA configuration
      cisco.ios.ios_command:
        commands:
          - show running-config | section aaa
      register: aaa_verification
      changed_when: false

    - name: Display AAA verification
      ansible.builtin.debug:
        var: aaa_verification.stdout_linesroot